<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- QuantPrep mark: a Q drawn as paths rather than text, so it rasterises
       identically everywhere without depending on an installed font. The glyph
       sits inside the central 80% so it survives a maskable crop. -->
  <rect width="512" height="512" rx="112" fill="#2454c9"/>
  <circle cx="256" cy="248" r="104" fill="none" stroke="#ffffff" stroke-width="40"/>
  <path d="M296 300 L372 376" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
</svg>
